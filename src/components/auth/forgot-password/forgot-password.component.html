<div class="container py-5">
  <div class="row justify-content-center align-items-center">
    <div class="col-md-6 d-none d-md-block">
      <img
        src="image/Forgot password.svg"
        alt="{{ 'AUTH.FORGOT_PASSWORD.TITLE' | translate }}"
        class="img-fluid"
      />
    </div>

    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h2 class="card-title text-center mb-4" appTranslate="AUTH.FORGOT_PASSWORD.TITLE">Forgot Password</h2>

          <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
            <div class="mb-3">
              <label for="email" class="form-label" appTranslate="AUTH.FORGOT_PASSWORD.EMAIL">Email address</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-control form-control-lg"
                [(ngModel)]="email"
                required
                email
                placeholder="{{ 'AUTH.FORGOT_PASSWORD.EMAIL' | translate }}"
              />
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-2"
              [disabled]="isLoading || !email"
            >
              @if (isLoading) {
              <span
                class="spinner-border spinner-border-sm me-2"
                role="status"
                aria-hidden="true"
              ></span>
              }
              {{ isLoading ? ('AUTH.FORGOT_PASSWORD.LOADING' | translate) : ('AUTH.FORGOT_PASSWORD.SUBMIT' | translate) }}
            </button>
          </form>

          @if (message) {
          <div class="alert alert-success mt-3 mb-0">{{ 'AUTH.FORGOT_PASSWORD.SUCCESS' | translate }}</div>
          } @if (error) {
          <div class="alert alert-danger mt-3 mb-0">{{ error }}</div>
          <div class="mt-3">
            <a routerLink="/login" class="btn btn-link px-0" appTranslate="AUTH.FORGOT_PASSWORD.BACK_TO_LOGIN">Back to Login</a>
          </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
