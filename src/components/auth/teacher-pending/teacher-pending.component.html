<div class="container">
  <div class="pending-container">
    <div class="pending-card">
      <div class="pending-icon">
        <i class="fas fa-clock"></i>
      </div>
      <h1 appTranslate="AUTH.TEACHER_PENDING.TITLE">Application Submitted</h1>
      <p class="lead" appTranslate="AUTH.TEACHER_PENDING.SUBTITLE">Thank you for applying to be a teacher on Testly!</p>
      <p appTranslate="AUTH.TEACHER_PENDING.MAIN_TEXT">
        Your application is now being reviewed by our administrators. This
        process typically takes 1-2 business days.
      </p>
      <p class="note" appTranslate="AUTH.TEACHER_PENDING.EMAIL_NOTE">
        We'll contact you via email once your application has been reviewed.
      </p>
      <div class="action-btns">
        <button (click)="goToHome()" class="btn btn-primary">
          {{ 'AUTH.TEACHER_PENDING.RETURN_HOME' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
